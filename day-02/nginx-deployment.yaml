
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-day2

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: nginx-day2

  template:
    metadata:
      labels:
        app: nginx-day2

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

