
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-day3

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-day3

  template:
    metadata:
      labels:
        app: nginx-day3

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
